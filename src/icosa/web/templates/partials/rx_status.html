<div class="flex items-center gap-2">
  <span id="rx-dot"
        class="h-2 w-2 rounded-full {{ 'bg-emerald-400 animate-pulse' if running else 'bg-slate-600' }}"></span>
  <span id="rx-label" class="text-xs font-medium {{ 'text-emerald-300' if running else 'text-slate-500' }}">
    {{ 'listening' if running else 'stopped' }}
  </span>
  {% if running %}
    <button hx-post="/rx/stop" hx-target="#rx-status" hx-swap="innerHTML"
            class="ml-2 rounded-lg border border-slate-700 px-3 py-1 text-xs text-slate-300 transition hover:border-red-500/60 hover:text-red-300">
      Stop
    </button>
  {% else %}
    <button hx-post="/rx/start" hx-target="#rx-status" hx-swap="innerHTML"
            class="ml-2 rounded-lg border border-slate-700 px-3 py-1 text-xs text-slate-300 transition hover:border-accent hover:text-accent">
      Start
    </button>
  {% endif %}
</div>
